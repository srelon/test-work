services:
  frontend-site:
    image: node:20-alpine
    container_name: dzencode_frontend_site
    working_dir: /var/www/frontend
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/var/www/frontend
    profiles:
      - site

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: dzencode_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      - db
    profiles:
      - phpmyadmin

  rabbitmq-ui:
    image: alpine/socat
    container_name: dzencode_rabbitmq_ui
    command: ["tcp-listen:15672,fork,reuseaddr", "tcp-connect:rabbitmq:15672"]
    ports:
      - "15672:15672"
    depends_on:
      - rabbitmq
    profiles:
      - rabbitmq-ui
